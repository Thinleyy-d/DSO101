name: Build and Deploy Todo App

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build & Push Backend Docker Image
      - name: Build and Push Backend Docker Image
        working-directory: ./Assignment_2/backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-app-backend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-app-backend:latest

      # 4. Build & Push Frontend Docker Image
      - name: Build and Push Frontend Docker Image
        working-directory: ./Assignment_2/frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-app-frontend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-app-frontend:latest

      # 5. Deploy to Render.com (via deploy hooks)
      # Render does not auto-redeploy when a new image is pushed to Docker Hub.
      # See: https://render.com/docs/deploy-hooks
      - name: Trigger Render Deployment
        env:
          RENDER_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
          RENDER_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "$RENDER_FRONTEND_DEPLOY_HOOK_URL"
          curl -fsS -X POST "$RENDER_BACKEND_DEPLOY_HOOK_URL"
